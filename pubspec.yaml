name: bes_consumption
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  english_words: ^4.0.0
  provider: ^6.0.0
  fl_chart: ^1.1.1
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.8
  # archive: 纯 Dart zip 实现，admin 一键导出 chips/earbuds/ 等 JSON 资源
  # 给用户回写到 assets/data/ 用；六端通吃，无原生依赖。
  archive: ^3.6.1
  # file_picker: admin「Sync Excel」选取 .xlsx/.csv 文件读取 bytes，六端通用。
  file_picker: ^8.1.2
  # http: admin 与最小后端(tool/chip_server)通信，Save 落地 JSON / 启动从后端加载。
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/config_manifest.json
    - assets/data/chips/
    - assets/data/chips/earbuds/
    - assets/data/chips/earbuds/Scene/
    - assets/data/chips/earbuds/Tx/
    - assets/data/chips/earbuds/Rx/
    - assets/data/chips/earbuds/CPU/
    - assets/data/chips/ble/
    - assets/data/chips/bt/
    - assets/data/chips/wifi/
