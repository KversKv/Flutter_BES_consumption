name: bes_consumption
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  english_words: ^4.0.0
  provider: ^6.0.0
  fl_chart: ^1.1.1
  shared_preferences: ^2.2.0
